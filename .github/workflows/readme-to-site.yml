name: Readme to GitHub Pages site
on:
  push:
    branches:
      - main
  # the PR review bot merges with GITHUB_TOKEN, which does not trigger push workflows,
  # so it dispatches this workflow explicitly after each merge
  workflow_dispatch:
concurrency:
  group: readme-to-site
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: actions/cache@v3
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs-material
      - run: mkdir ./docs
      - run: cp README.md ./docs/index.md
      - run: mkdocs gh-deploy --force
