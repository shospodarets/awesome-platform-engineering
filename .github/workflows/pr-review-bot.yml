name: PR review bot

# Reviews list submissions with Claude and merges, declines, asks for changes or escalates to the
# maintainer. Runs from the base branch only (pull_request_target): the PR's code is never checked
# out or executed; its README is read through the API and linted as data in a job without secrets.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prs:
        description: 'PR numbers, comma separated (empty = every open PR; "selftest" = test the escalation email)'
        required: false
        default: ''
      dry_run:
        description: 'Only print what would happen'
        type: boolean
        default: true
  schedule:
    # backstop sweep: catches anything a missed or failed event left behind
    - cron: '23 */6 * * *'

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/pr-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        working-directory: .github/pr-bot
        env:
          PR_BOT_DISPATCH_PRS: ${{ inputs.prs }}
        run: python -m bot plan

  readme-lint:
    name: readme-lint
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint each PR's README (as data, with the base repo's trusted linter)
        env:
          GH_TOKEN: ${{ github.token }}
          github_token: ${{ github.token }}   # awesome-lint's GitHub rule, avoids anonymous rate limits
          PRS: ${{ needs.plan.outputs.prs }}
        run: |
          mkdir -p lint
          if [ "$PRS" = "[]" ]; then
            PRS=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '[.[].number]')
          fi
          cp README.md /tmp/base-README.md
          # only problems the PR introduces count: compare against the problems main already has
          npx --no-install awesome-lint 2>&1 | grep -E '✖|⚠' | sed -E 's/[0-9]+:[0-9]+//; s/[[:space:]]+/ /g' | grep -v -E '^ ?✖ Linting' | sort -u > /tmp/base-errors.txt || true
          for n in $(echo "$PRS" | jq -r '.[]'); do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .head.sha) || continue
            if ! gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/README.md?ref=$sha" > README.md; then
              cp /tmp/base-README.md README.md; continue
            fi
            out=$(npx --no-install awesome-lint 2>&1) || true
            new=$(printf '%s\n' "$out" | grep -E '✖|⚠' | sed -E 's/[0-9]+:[0-9]+//; s/[[:space:]]+/ /g' | grep -v -E '^ ?✖ Linting' | sort -u | comm -23 - /tmp/base-errors.txt | grep -v -i -E 'rate limit|problem trying to connect|should be on github' || true)
            if [ -z "$new" ]; then ok=true; else ok=false; fi
            jq -n --argjson pr "$n" --arg sha "$sha" --argjson ok "$ok" --arg new "$new" --arg out "$out" \
              '{pr:$pr, sha:$sha, ok:$ok, summary:($new | split("\n") | join("; ") | .[0:600]), output:($out | .[0:4000]), source:"pr-review-bot lint"}' \
              > "lint/lint-$n.json"
          done
          cp /tmp/base-README.md README.md
      - uses: actions/upload-artifact@v4
        with:
          name: lint
          path: lint/
          if-no-files-found: ignore
          retention-days: 3

  act:
    needs: [plan, readme-lint]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # one bot action at a time, first in first out: no dropped events, no merge races, and the
    # Anthropic org's low concurrent-connection limit is never exceeded
    concurrency:
      group: pr-review-bot-act
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write        # merge PRs
      pull-requests: write   # comment, label, close, reopen
      issues: write          # labels, assignment, failure issue
      actions: write         # dispatch the GitHub Pages workflow after a merge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/pr-bot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/pr-bot/requirements.txt
      - run: pip install -r .github/pr-bot/requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lint
          path: lint
      - name: Review and act
        working-directory: .github/pr-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_BOT_LINT_DIR: ${{ github.workspace }}/lint
          PR_BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PRS: ${{ needs.plan.outputs.prs }}
          PR_BOT_DISPATCH_PRS: ${{ inputs.prs }}
        run: python -m bot run --prs "$PRS"
